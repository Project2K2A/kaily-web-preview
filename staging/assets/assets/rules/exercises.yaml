meta:
  version: 3
  updated: 2026-08-04
  source_refs:
    - wger.de API v2（ライセンスは種目ごと、CC-BY-SA 4中心・帰属表示必須）
    - free-exercise-db（Unlicense / パブリックドメイン）
    - research/2026-07-wger/bodyweight-classified.md
    - research/2026-07-wger/equipment-classified.md
    - research/2026-08-exercise-coverage/README.md（v3追加分の根拠と過不足分析）
  note: 全属性はAI叩き台。安全性項目（noise_level/knee_load_high/load_parts/level/variation）はチームレビューで確定させる
  changelog_v2: |
    2026-07-28 品質改善: (1)一般的な日本名が存在する23種のname_jaを修正
    (例: スモウスクワット→ワイドスクワット、ウォールスクワット→空気椅子)。
    一般名のない種目は造語せず英名カタカナを維持。
    (2)稼働中の自重144種すべてに how_to(手順)と form_points(フォームのポイント)を追加。
    休止中の器具種目41種は未整備(器具対応の復活時に追加)。

  changelog_v3: |
    2026-08-05 網羅性の見直し(2): 自重以外の道具が必須の種目を器具扱いにして休止
    (chair=椅子/台/机/ソファ13件、step=踏み台/階段2件、towel=タオル2件、weight=重り1件)。
    壁・ドア枠・床は「部屋の一部」として器具に含めない。
    完全重複5件を削除(quadriped-arm-and-leg-raise/front-plank/hip-bridge/
    bodyweight-lunge-hd/side-plank-right)。
    左右で別IDだった10種目を per_side: true の1件に統合
    (左だけが処方され右が実施されないという不具合の解消も兼ねる)。
    立位×器具なしで唯一のpull種目としてウォールエンジェルを追加。
    結果 240→227件、稼働中の自重は199→168件。
    set_sec の意味を明文化: per_side: true の種目は「片側1セットあたり」の秒数。
    2026-08-04 網羅性の見直し: 一般に広く知られた自重種目55件を追加(185→240件)。
    追加の主眼は (1)pullスロットの構造的欠落
    （自重3件→12件。バックエクステンション・タオルロー・斜め懸垂等）、
    (2)ヒンジ（股関節を折る）パターンの新設（ヒップヒンジ・片脚デッドリフト・
    ノルディックカール）、(3)日本で最も知られた種目の欠落補完（シットアップ・
    ロシアンツイスト・デッドバグ・斜め腕立て・足上げ腕立て・踏み台昇降・
    ジャンピングスクワット・ステップアップ・ファイアハイドラント）、
    (4)立位のみ(space=stand)ユーザー向け種目の増強、(5)L3の底上げ、
    (6)クールダウンの部位漏れ（前もも・お尻・広背筋・手首）と
    立位上腕二頭筋ストレッチ(右)の欠落修正。
    追加分の属性もAI叩き台。既存分と同じくチームレビューで確定させる。
    記載順は末尾追加のため、同点タイのランキング順位は既存種目が優先される
    （＝既存プランの出力は変わらない）。

exercises:
  - id: step-jack
    name_ja: ステップジャック
    name_en: Step Jack
    slot: cardio
    role: main
    level: L1
    equipment: []
    noise_level: quiet_ok
    space: stand
    load_parts: []
    target_parts: [all]
    measurement: seconds
    per_side: false
    set_sec: 45
    variation:
      harder: jumping-jack-hd
    how_to:
      - "腕を体の横に下ろして立つ"
      - "右足を横に1歩踏み出すと同時に、両腕を頭上へ広げる"
      - "足と腕を戻し、左側も同様に。ジャンプせず左右交互に続ける"
    form_points:
      - "ジャンプしない(片足ずつステップ)"
      - "腕は大きく頭上まで"
      - "膝を軽くゆるめて着地"
      - "テンポよく"
